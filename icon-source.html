<!-- SOURCE for the home-screen / PWA icons: apple-touch-icon.png (180),
     icon-192.png, icon-512.png. Blue square + cream Trove house-and-keyhole.
     Render on a machine with a GUI session (headless Chrome):

       CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
       BASE="/Users/michaellane/CLAUDE CODE/ledger"
       "$CHROME" --headless=new --disable-gpu --force-device-scale-factor=1 \
         --window-size=512,512 --screenshot="$BASE/icon-512.png" \
         "file://$BASE/icon-source.html"
       sips -Z 192 "$BASE/icon-512.png" --out "$BASE/icon-192.png"
       sips -Z 180 "$BASE/icon-512.png" --out "$BASE/apple-touch-icon.png"

     iOS/Android round the square themselves, so keep it full-bleed. -->
<style>
  *{margin:0;padding:0;}
  html,body{width:512px;height:512px;}
  .icon{width:512px;height:512px;background:#2E6BB0;display:flex;align-items:center;justify-content:center;}
  .icon svg{width:300px;height:300px;color:#EDE8E1;display:block;}
</style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 1.6 23.4 10.6H20v8.8A2.6 2.6 0 0 1 17.4 22H6.6A2.6 2.6 0 0 1 4 19.4v-8.8H0.6Z M12 12.2m-2.4 0a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0-4.8 0Z M10.9 14.2h2.2l.35 5.2h-2.9Z"/></svg>
  </div>
